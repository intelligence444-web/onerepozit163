<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" preserveAspectRatio="xMidYMax meet">
  <!-- Силуэт жилого комплекса для фона первого экрана -->
  <defs>
    <pattern id="w1" width="14" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="6" height="8" rx="1" fill="#f3f5ff"/></pattern>
    <pattern id="w2" width="16" height="20" patternUnits="userSpaceOnUse"><rect x="4" y="6" width="8" height="9" rx="1" fill="#eef1ff"/></pattern>
  </defs>

  <!-- дальний ряд -->
  <g fill="#e3e8fe">
    <rect x="20" y="210" width="70" height="250"/>
    <rect x="250" y="150" width="64" height="310"/>
    <rect x="470" y="180" width="80" height="280"/>
    <rect x="640" y="230" width="70" height="230"/>
  </g>
  <g fill="url(#w1)" opacity=".8">
    <rect x="20" y="210" width="70" height="250"/>
    <rect x="250" y="150" width="64" height="310"/>
    <rect x="470" y="180" width="80" height="280"/>
    <rect x="640" y="230" width="70" height="230"/>
  </g>

  <!-- строящаяся секция с краном -->
  <g fill="none" stroke="#c3cdfc" stroke-width="3">
    <path d="M560 460V120M600 460V120M560 120h40M560 160l40 40M600 160l-40 40M560 240l40 40M600 240l-40 40M560 320l40 40M600 320l-40 40"/>
    <path d="M580 120V40M500 52h200M580 40l-80 12M580 40l120 12M690 52v60"/>
  </g>
  <rect x="680" y="112" width="20" height="16" fill="#c3cdfc"/>

  <!-- ближний ряд -->
  <g fill="#d3dbfd">
    <rect x="80" y="120" width="96" height="340" rx="2"/>
    <rect x="176" y="200" width="70" height="260"/>
    <rect x="330" y="90" width="110" height="370" rx="2"/>
    <rect x="440" y="250" width="60" height="210"/>
  </g>
  <g fill="url(#w2)">
    <rect x="80" y="120" width="96" height="340"/>
    <rect x="176" y="200" width="70" height="260"/>
    <rect x="330" y="90" width="110" height="370"/>
    <rect x="440" y="250" width="60" height="210"/>
  </g>
  <!-- крыши и балконы -->
  <g fill="#c3cdfc">
    <rect x="74" y="112" width="108" height="10" rx="2"/>
    <rect x="324" y="82" width="122" height="10" rx="2"/>
    <rect x="352" y="62" width="30" height="22"/>
  </g>

  <!-- деревья -->
  <g fill="#cfe9dc">
    <circle cx="44" cy="430" r="22"/><circle cx="290" cy="436" r="18"/><circle cx="524" cy="432" r="20"/><circle cx="626" cy="438" r="16"/>
  </g>

</svg>
